<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widgets — System Director</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>
  <section><h2>Languages and translated widgets</h2><p>Choose the translation editing language in Widget Config. Base text remains the source; language overrides are stored separately and follow the configured fallback chain. Data paths, formulas, IDs, CSS and Select values remain stable.</p></section>
  <header class="site-header"></header>

  <main class="page">
    <h1 data-bilingual data-en="Widget reference" data-ru="Справочник виджетов"></h1>
    <p class="lead" data-bilingual data-en="Widget types, variants and style settings available in the sheet editor." data-ru="Типы виджетов, варианты и настройки стиля, доступные в редакторе листа."></p>

    <div class="callout tip" data-bilingual
      data-en="Widgets are UI components. They store their configuration in sheet layout data and bind visible controls to Foundry document paths or graph actions."
      data-ru="Виджеты — это UI-компоненты. Их конфигурация хранится в layout листа, а видимые контролы привязываются к Foundry document paths или graph actions."></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search…" data-i18n-attr="placeholder|ui.search">
    </div>

    <div class="wgt-grid" id="wgt-grid"></div>
  </main>

  <footer class="site">© System Director Wiki</footer>

  <script type="module">
    import { bootPage } from "./js/main.js";
    import { pickLocale, getLang } from "./js/i18n.js";
    import { renderWidgetPreview } from "./js/render-widget.js";
    import { widgetUsage } from "./js/wiki-copy.js";
    await bootPage();

    const [widgetsR, stylesR, trR] = await Promise.all([
      fetch("data/widgets.json").then(r => r.json()),
      fetch("data/widget-styles.json").then(r => r.json()),
      fetch("data/translations.json").then(r => r.json())
    ]);

    const grid = document.getElementById("wgt-grid");

    function renderCards() {
      grid.innerHTML = "";
      const lang = getLang();
      for (const [id, def] of Object.entries(widgetsR)) {
        const card = document.createElement("div");
        card.className = "wgt-card";
        card.dataset.searchKey = id + " " + (def.label ?? "") + " " + (def.desc ?? "");

        const tr = trR.widgets?.[id] ?? {};
        const labelLocal = lang === "ru" && tr.label?.ru ? tr.label.ru : (def.label ?? id);
        const descLocal  = lang === "ru" && tr.desc?.ru  ? tr.desc.ru  : (def.desc  ?? "");

        const styleFields = stylesR[id] ?? [];
        const cfgFields   = def.configFields ?? [];

        // ----- Header
        const h3 = document.createElement("h3");
        const ic = document.createElement("span");
        ic.className = "ic";
        ic.innerHTML = `<i class="fa ${def.icon ?? "fa-cube"}"></i>`;
        h3.appendChild(ic);
        h3.appendChild(document.createTextNode(labelLocal));
        const idChip = document.createElement("code");
        idChip.style.cssText = "margin-left:auto;font-size:11px;color:var(--fg-mut)";
        idChip.textContent = id;
        h3.appendChild(idChip);
        card.appendChild(h3);

        const desc = document.createElement("div");
        desc.className = "desc";
        const usage = widgetUsage[id];
        const usageText = usage ? pickLocale(usage) : "";
        desc.textContent = usageText ? `${descLocal} — ${usageText}` : descLocal;
        card.appendChild(desc);

        if (def.variants?.length) {
          const variants = document.createElement("div");
          variants.className = "pin-legend";
          variants.innerHTML = def.variants.map(v => `<span class="pin-tag"><span class="dot"></span>${v}</span>`).join("");
          card.appendChild(variants);
        }

        // ----- Preview
        const frame = document.createElement("div");
        frame.className = "frame";
        frame.appendChild(renderWidgetPreview(id, def));
        card.appendChild(frame);

        // ----- Config fields
        if (cfgFields.length) {
          const det = document.createElement("details");
          const sum = document.createElement("summary");
          sum.textContent = lang === "ru" ? `Поля настройки (${cfgFields.length})` : `Config fields (${cfgFields.length})`;
          det.appendChild(sum);
          const ul = document.createElement("ul");
          for (const f of cfgFields) {
            const li = document.createElement("li");
            li.innerHTML = `<code>${f.key}</code> <span style="color:var(--fg-mut)">${f.type}</span> — ${f.label ?? ""}`;
            ul.appendChild(li);
          }
          det.appendChild(ul);
          card.appendChild(det);
        }

        // ----- Defaults
        if (def.defaults && Object.keys(def.defaults).length) {
          const det = document.createElement("details");
          const sum = document.createElement("summary");
          sum.textContent = lang === "ru" ? "По умолчанию" : "Defaults";
          det.appendChild(sum);
          const pre = document.createElement("pre");
          pre.style.cssText = "font-family:monospace;font-size:11px;background:var(--bg);padding:8px;border-radius:6px;margin:6px 0;overflow:auto";
          pre.textContent = JSON.stringify(def.defaults, null, 2);
          det.appendChild(pre);
          card.appendChild(det);
        }

        // ----- Style fields
        if (styleFields.length) {
          const det = document.createElement("details");
          const sum = document.createElement("summary");
          sum.textContent = lang === "ru" ? `Стилевые поля (${styleFields.length})` : `Style fields (${styleFields.length})`;
          det.appendChild(sum);
          const ul = document.createElement("ul");
          for (const [label, key, type] of styleFields) {
            const li = document.createElement("li");
            const ttype = type === "style-color" ? "color" : (type === "style-px" ? "px" : type);
            li.innerHTML = `<code>${key}</code> <span style="color:var(--fg-mut)">${ttype}</span> — ${label}`;
            ul.appendChild(li);
          }
          det.appendChild(ul);
          card.appendChild(det);
        }

        grid.appendChild(card);
      }
    }
    renderCards();
    window.addEventListener("sd:lang-change", renderCards);

    // Search
    const search = document.getElementById("search");
    search.addEventListener("input", () => {
      const q = search.value.toLowerCase().trim();
      for (const card of grid.children) {
        const k = card.dataset.searchKey.toLowerCase();
        card.style.display = (!q || k.includes(q)) ? "" : "none";
      }
    });
  </script>
</body>
</html>
