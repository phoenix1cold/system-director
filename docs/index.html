<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Director — Wiki</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>
  <header class="site-header"></header>
  <main class="page">
    <h1 data-i18n="ui.siteTitle">System Director — Wiki</h1>
    <p class="lead" data-bilingual
       data-en="System-agnostic sheet builder and node-graph automation toolkit for Foundry VTT v13/v14."
       data-ru="System-agnostic конструктор листов и нодовая автоматизация для Foundry VTT v13/v14."></p>

    <div id="stats" class="stats-grid"></div>

    <div class="callout warn" data-bilingual
      data-en="This documentation is generated for the current codebase: 30 widgets and 273 node definitions. Node cards are rebuilt from the actual source definitions, not from the old wiki list."
      data-ru="Эта документация собрана под текущий код: 30 виджетов и 273 определения нод. Карточки нод построены из актуальных исходных definitions, а не из старого списка wiki."></div>

    <h2 data-bilingual data-en="What System Director does" data-ru="Что делает System Director"></h2>
    <div class="cards">
      <div class="card"><h3 data-bilingual data-en="Visual sheets" data-ru="Визуальные листы"></h3><p data-bilingual data-en="Build actor and item sheets from tabs, rows, cells and drag-and-drop widgets. Store the layout in system.customTabs." data-ru="Листы акторов и предметов собираются из вкладок, рядов, ячеек и drag-and-drop виджетов. Раскладка хранится в system.customTabs."></p></div>
      <div class="card"><h3 data-bilingual data-en="Node graph automation" data-ru="Нодовая автоматизация"></h3><p data-bilingual data-en="Wire click actions, rolls, checks, resources, effects, items, quests, cards, AoE and events without writing JavaScript." data-ru="Связывайте клики, броски, проверки, ресурсы, эффекты, предметы, квесты, карты, AoE и события без JavaScript."></p></div>
      <div class="card"><h3 data-bilingual data-en="Foundry-native data" data-ru="Foundry-native данные"></h3><p data-bilingual data-en="Uses Foundry TypeDataModel, Actor/Item documents, ActiveEffect, ChatMessage, Regions, Cards, Hooks and sockets." data-ru="Использует Foundry TypeDataModel, Actor/Item documents, ActiveEffect, ChatMessage, Regions, Cards, Hooks и sockets."></p></div>
      <div class="card"><h3 data-bilingual data-en="System building blocks" data-ru="Блоки для своей системы"></h3><p data-bilingual data-en="Attributes, skills, resources, hidden fields, slots, inventories, spell slots, Action HUD, quest logs, card hands and templates." data-ru="Характеристики, навыки, ресурсы, hidden fields, слоты, инвентарь, spell slots, Action HUD, quest logs, руки карт и шаблоны."></p></div>
    </div>

    <h2 data-bilingual data-en="Recommended reading order" data-ru="Рекомендуемый порядок чтения"></h2>
    <ol class="flow-steps">
      <li data-bilingual data-en="Start with installation and first sheet in Getting started." data-ru="Начните с установки и первого листа на странице «С чего начать»."></li>
      <li data-bilingual data-en="Read Concepts for document paths, hidden fields, slots, triggers and Foundry data model notes." data-ru="Прочитайте «Концепции»: пути документов, hidden fields, слоты, триггеры и заметки по Foundry data model."></li>
      <li data-bilingual data-en="Use Widgets as the UI catalog: each card lists config fields, defaults, variants and style fields." data-ru="Используйте «Виджеты» как UI-каталог: поля настройки, defaults, variants и style-поля."></li>
      <li data-bilingual data-en="Use Nodes as the technical reference: categories, pins, fields, flags and interaction rules." data-ru="Используйте «Ноды» как технический справочник: категории, пины, поля, флаги и правила взаимодействия."></li>
      <li data-bilingual data-en="Use Examples as copyable graph recipes for common workflows." data-ru="Используйте «Примеры» как рецепты графов для типовых сценариев."></li>
    </ol>

    <h2 data-bilingual data-en="Quick links" data-ru="Быстрые ссылки"></h2>
    <div class="cards">
      <div class="card"><h3 data-i18n="ui.nav.start"></h3><p data-bilingual data-en="Install, create a world, open the builder, build a first sheet and graph." data-ru="Установка, создание мира, открытие конструктора, первый лист и граф."></p><a class="btn" href="getting-started.html" data-bilingual data-en="Open" data-ru="Открыть"></a></div>
      <div class="card"><h3 data-i18n="ui.nav.concepts"></h3><p data-bilingual data-en="Core architecture: documents, paths, slots, hidden fields, triggers, Action HUD and Foundry APIs." data-ru="Архитектура: documents, paths, slots, hidden fields, triggers, Action HUD и Foundry API."></p><a class="btn" href="concepts.html" data-bilingual data-en="Open" data-ru="Открыть"></a></div>
      <div class="card"><h3 data-i18n="ui.nav.widgets"></h3><p data-bilingual data-en="All widget types rendered from current code definitions." data-ru="Все типы виджетов из текущих code definitions."></p><a class="btn" href="widgets.html" data-bilingual data-en="Browse" data-ru="Перейти"></a></div>
      <div class="card"><h3 data-i18n="ui.nav.nodes"></h3><p data-bilingual data-en="Full node catalog, rewritten for the current graph system." data-ru="Полный каталог нод, переписанный под текущую систему графов."></p><a class="btn" href="nodes.html" data-bilingual data-en="Browse" data-ru="Перейти"></a></div>
      <div class="card"><h3 data-i18n="ui.nav.examples"></h3><p data-bilingual data-en="Recipes for rolls, damage, slots, AoE, events, quests and cards." data-ru="Рецепты для бросков, урона, слотов, AoE, событий, квестов и карт."></p><a class="btn" href="examples.html" data-bilingual data-en="Browse" data-ru="Перейти"></a></div>
    </div>
  </main>
  <footer class="site">© System Director Wiki</footer>
  <script type="module">
    import { bootPage } from './js/main.js';
    import { pickLocale } from './js/i18n.js';
    await bootPage();
    const [nodes, widgets, byCat] = await Promise.all([
      fetch('data/nodes.json').then(r=>r.json()),
      fetch('data/widgets.json').then(r=>r.json()),
      fetch('data/nodes-by-category.json').then(r=>r.json())
    ]);
    const stats = document.getElementById('stats');
    const cards = [
      [Object.keys(widgets).length, {en:'Widgets',ru:'Виджетов'}],
      [Object.keys(nodes).length, {en:'Node definitions',ru:'Определений нод'}],
      [Object.keys(byCat).length, {en:'Node categories',ru:'Категорий нод'}],
      [Object.values(nodes).filter(n=>n.isEvent||n.isTrigger).length, {en:'Event/trigger nodes',ru:'Event/trigger нод'}]
    ];
    function renderStats(){ stats.innerHTML=''; for (const [num,lbl] of cards){ const el=document.createElement('div'); el.className='stat-card'; el.innerHTML=`<div class="num">${num}</div><div class="lbl">${pickLocale(lbl)}</div>`; stats.appendChild(el);} }
    renderStats(); window.addEventListener('sd:lang-change', renderStats);
  </script>
</body>
</html>
