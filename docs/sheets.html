<header class="site-header"></header>
<main class="page wiki-page">
  <div class="page-heading">
    <span class="release-badge">System Director 0.19.0 · Foundry v13/v14</span>
    <h1 data-bilingual data-en="Sheets and widgets" data-ru="Листы и виджеты"></h1>
    <p class="lead" data-bilingual data-en="How to build layouts, bind paths and use the free-layout Widget Builder." data-ru="Как собирать раскладки, привязывать пути и использовать свободный Widget Builder."></p>
  </div>

<section><h2 data-bilingual data-en="Sheet editing" data-ru="Редактирование листа"></h2><ol class="flow-steps"><li data-bilingual data-en="Open the sheet menu and enable edit mode." data-ru="Откройте меню листа и включите режим редактирования."></li><li data-bilingual data-en="Use + to add tabs. Inside a tab, add rows and drop widgets into cells." data-ru="Кнопкой + добавьте вкладки. Внутри вкладки создавайте строки и переносите виджеты в ячейки."></li><li data-bilingual data-en="Drag a widget by its handle. Use its settings button to configure paths, labels, variants and style." data-ru="Перетаскивайте виджет за рукоятку. В настройках задавайте пути, подписи, варианты и стиль."></li><li data-bilingual data-en="Save the sheet template when the same layout must be reused." data-ru="Сохраните шаблон листа, если раскладку нужно использовать повторно."></li></ol></section>
<section><h2 data-bilingual data-en="Widget Builder canvas" data-ru="Canvas Widget Builder"></h2><p data-bilingual data-en="Widget Builder provides a free-layout canvas inside a sheet cell. Add labels, buttons, images and nested widgets, move them on the grid, resize from the corner and change their layer order." data-ru="Widget Builder создаёт свободный canvas внутри ячейки. Добавляйте подписи, кнопки, изображения и вложенные виджеты, двигайте их по сетке, меняйте размер за угол и порядок слоёв."></p><ul><li data-bilingual data-en="Position and size are stored with the widget definition." data-ru="Позиция и размер сохраняются в определении виджета."></li><li data-bilingual data-en="Use layer controls when elements overlap." data-ru="Используйте управление слоями, если элементы перекрываются."></li><li data-bilingual data-en="Custom CSS is scoped to the Widget Builder instance; global selectors and unsafe rules are rejected." data-ru="Пользовательский CSS ограничен текущим Widget Builder; глобальные селекторы и небезопасные правила отбрасываются."></li></ul></section>
<section><h2 data-bilingual data-en="Paths" data-ru="Пути данных"></h2><div class="path-grid"><code>system.resources.hp.value</code><code>system.attributes.attr1.value</code><code>system.skills.skill1.rank</code><code>system.hiddenFields.stress</code><code>system.currency.gold</code><code>system.activeQuest</code></div><div class="callout warn" data-bilingual data-en="A path must point to the document shown by the sheet. When a widget is copied between Actor and Item sheets, check the path again." data-ru="Путь должен существовать на документе текущего листа. После переноса виджета между Actor и Item проверьте путь заново."></div></section>
<section><h2 data-bilingual data-en="Rich Text" data-ru="Rich Text"></h2><p data-bilingual data-en="Rich Text uses the Foundry editor on rich text paths and a normal textarea only for plain or hidden fields. Width, word wrapping and automatic height follow the Widget Builder bounds." data-ru="Rich Text использует редактор Foundry для rich-text путей и обычный textarea только для простых или hidden-полей. Ширина, перенос слов и автоматическая высота учитывают границы Widget Builder."></p></section>

</main>
