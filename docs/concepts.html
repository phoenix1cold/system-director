    <h1 data-bilingual data-en="Core concepts" data-ru="Основные концепции"></h1>
    <p class="lead" data-bilingual data-en="The data and execution model used across sheets, widgets and graphs." data-ru="Модель данных и выполнения, общая для листов, виджетов и графов."></p>
  </div>

<section><h2 data-bilingual data-en="Documents store the rules" data-ru="Правила хранятся в документах"></h2><p data-bilingual data-en="Actors and Items store system data. Widgets read and edit document paths. Node graphs react to clicks and Foundry events." data-ru="Actors и Items хранят system data. Виджеты читают и изменяют пути документа. Нодовые графы реагируют на клики и события Foundry."></p></section>
<section><h2 data-bilingual data-en="Actor and Item context" data-ru="Контекст Actor и Item"></h2><p data-bilingual data-en="Self (Actor) resolves the current actor or the owning actor of an item. Self (Item) resolves the item that owns the graph. Explicit target pins override these defaults." data-ru="Self (Actor) возвращает текущего актора или владельца предмета. Self (Item) возвращает предмет, которому принадлежит граф. Явные target-пины имеют приоритет."></p></section>
<section><h2 data-bilingual data-en="Persistent and temporary data" data-ru="Постоянные и временные данные"></h2><ul><li><code>system.resources / attributes / skills</code> — core rules.</li><li><code>system.hiddenFields</code> — custom sheet values.</li><li><code>flags.sd</code> — runtime/system metadata.</li><li><code>system.customTabs</code> — sheet layout.</li><li><code>system.sdTriggerGraph</code> — event graph.</li></ul></section>
<section><h2 data-bilingual data-en="Foundry-native behavior" data-ru="Foundry-native поведение"></h2><p data-bilingual data-en="System Director uses Actor, Item, ActiveEffect, ChatMessage, Region, Cards, Hooks and ApplicationV2. In Foundry v14, Region replaces the removed MeasuredTemplate document. Permissions still follow Foundry ownership rules." data-ru="System Director использует Actor, Item, ActiveEffect, ChatMessage, Region, Cards, Hooks и ApplicationV2. В Foundry v14 документ MeasuredTemplate удалён и заменён Region. Права доступа подчиняются ownership Foundry."></p></section>
