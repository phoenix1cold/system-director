<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -130 260 260" width="260" height="260" aria-label="System Director">
  <defs>
    <radialGradient id="sd-cube-bg" cx="0" cy="0" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1ea8ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0a3a66" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sd-cube-inner-tri" x1="0" y1="-40" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2bb6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a76d4" stop-opacity="0.20"/>
    </linearGradient>
    <filter id="sd-cube-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b1"/>
      <feGaussianBlur stdDeviation="5"   in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sd-cube-glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"  result="b1"/>
      <feGaussianBlur stdDeviation="10" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle r="118" fill="url(#sd-cube-bg)"/>

  <g class="sd-cube-figure" filter="url(#sd-cube-glow)" stroke="#3ec3ff" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" stroke-width="2.6"/>

    <g stroke-width="1.4" opacity="0.95">
      <line x1="0"     y1="-100" x2="50"    y2="-20"/>
      <line x1="0"     y1="-100" x2="-50"   y2="-20"/>
      <line x1="86.6"  y1="-50"  x2="50"    y2="-20"/>
      <line x1="86.6"  y1="-50"  x2="50"    y2="35"/>
      <line x1="86.6"  y1="50"   x2="50"    y2="35"/>
      <line x1="86.6"  y1="50"   x2="0"     y2="55"/>
      <line x1="0"     y1="100"  x2="0"     y2="55"/>
      <line x1="0"     y1="100"  x2="-50"   y2="35"/>
      <line x1="-86.6" y1="50"   x2="-50"   y2="35"/>
      <line x1="-86.6" y1="50"   x2="-50"   y2="-20"/>
      <line x1="-86.6" y1="-50"  x2="-50"   y2="-20"/>
      <line x1="-86.6" y1="-50"  x2="50"    y2="-20"/>
      <line x1="86.6"  y1="-50"  x2="-50"   y2="-20"/>
      <line x1="86.6"  y1="50"   x2="-50"   y2="35"/>
      <line x1="-86.6" y1="50"   x2="50"    y2="35"/>
      <line x1="-86.6" y1="-50"  x2="50"    y2="35"/>
      <line x1="0"     y1="-100" x2="0"     y2="55"/>
      <line x1="0"     y1="100"  x2="50"    y2="-20"/>
      <line x1="0"     y1="100"  x2="-50"   y2="-20"/>
    </g>

    <polygon points="-50,-20 50,-20 0,55" fill="url(#sd-cube-inner-tri)" stroke="#5fd5ff" stroke-width="2.2"/>

    <g fill="#7fe2ff" stroke="none" filter="url(#sd-cube-glow-strong)">
      <circle cx="0"     cy="-100" r="3.2"/>
      <circle cx="86.6"  cy="-50"  r="3.2"/>
      <circle cx="86.6"  cy="50"   r="3.2"/>
      <circle cx="0"     cy="100"  r="3.2"/>
      <circle cx="-86.6" cy="50"   r="3.2"/>
      <circle cx="-86.6" cy="-50"  r="3.2"/>
      <circle cx="50"    cy="-20"  r="2.6"/>
      <circle cx="-50"   cy="-20"  r="2.6"/>
      <circle cx="50"    cy="35"   r="2.6"/>
      <circle cx="-50"   cy="35"   r="2.6"/>
      <circle cx="0"     cy="55"   r="2.6"/>
    </g>
  </g>

  <text x="0" y="14" text-anchor="middle"
        font-family="'Orbitron','Eurostile','Bank Gothic','Arial Black',sans-serif"
        font-weight="900" font-size="32" fill="#031024" letter-spacing="2">SD</text>
</svg>
