name: Release

# Builds system.zip + rewrites system.json with release URLs, then uploads
# both to the GitHub Release so Foundry VTT can install/update the system
# directly from a manifest URL.
#
#  - manifest (stable, "latest"):
#      https://github.com/<OWNER>/<REPO>/releases/latest/download/system.json
#  - download (pinned per-version):
#      https://github.com/<OWNER>/<REPO>/releases/download/<tag>/system.zip
#
# Triggered either by pushing a git tag like `v0.0.3` or by creating a
# GitHub Release manually through the UI.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.3). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: meta
        run: |
          set -e
          RAW_REF="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${RAW_REF#refs/tags/}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO"       >> "$GITHUB_OUTPUT"
          echo "Building tag=$TAG version=$VERSION for $REPO"

      - name: Rewrite system.json (version + manifest/download URLs)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -e
          jq \
            --arg version  "$VERSION" \
            --arg url      "https://github.com/$REPO" \
            --arg manifest "https://github.com/$REPO/releases/latest/download/system.json" \
            --arg download "https://github.com/$REPO/releases/download/$TAG/system.zip" \
            --arg readme   "https://github.com/$REPO/blob/main/README.md" \
            --arg bugs     "https://github.com/$REPO/issues" \
            --arg changes  "https://github.com/$REPO/releases" \
            '.version=$version
             | .url=$url
             | .manifest=$manifest
             | .download=$download
             | .readme=$readme
             | .bugs=$bugs
             | .changelog=$changes' \
            system.json > system.json.tmp
          mv system.json.tmp system.json
          echo "--- system.json ---"
          cat system.json

      - name: Build system.zip
        run: |
          set -e
          # Zip the repo content at its top level so system.json sits at
          # the root of the archive — Foundry extracts into Data/systems/<id>/.
          zip -r system.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.zip" \
            -x "**/.DS_Store"
          ls -lh system.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            system.json
            system.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
